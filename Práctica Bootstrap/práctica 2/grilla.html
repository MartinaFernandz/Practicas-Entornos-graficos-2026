<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Práctica 2 - Ejercicio 2 (Bootstrap)</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    .caja {
      border-radius: 2px;
      margin-bottom: 12px;
    }
    .caja-morada   { background-color: #947196; height: 80px; }
    .caja-sidebar  { background-color: #f7ded3; min-height: 80px; }
    .caja-verde    { background-color: #63c780; height: 50px; }
    .caja-gris     { background-color: #8c7e8c; height: 50px; }
    .caja-celeste  { background-color: #799dcb; height: 100px; }

    @media (min-width: 768px) {
      .caja-sidebar {
        height: calc(100% - 12px);
      }
    }
  </style>
</head>
<body>

  <div class="container my-3">

    <div class="row">
      <div class="col-12">
        <div class="caja caja-morada"></div>
      </div>
    </div>

    <div class="row">

      <div class="col-12 col-md-3">
        <div class="caja caja-sidebar"></div>
      </div>

      <div class="col-12 col-md-9">
        <div class="row">

          <div class="col-12">
            <div class="caja caja-verde"></div>
          </div>

          <div class="col-6 col-md-4">
            <div class="caja caja-gris"></div>
          </div>
          <div class="col-6 col-md-4">
            <div class="caja caja-gris"></div>
          </div>
          <div class="col-6 col-md-4">
            <div class="caja caja-gris"></div>
          </div>
          <div class="col-6 col-md-4">
            <div class="caja caja-gris"></div>
          </div>
          <div class="col-6 col-md-4">
            <div class="caja caja-gris"></div>
          </div>
          <div class="col-6 col-md-4">
            <div class="caja caja-gris"></div>
          </div>

          <div class="col-6 col-md-4">
            <div class="caja caja-celeste"></div>
          </div>
          <div class="col-6 col-md-8">
            <div class="caja caja-celeste"></div>
          </div>

        </div>
      </div>
    </div>

  </div>

</body>
</html>
