<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <title>Recomendar sitio</title>
</head>

<body>
  <h1>Recomendar este sitio a un amigo</h1>

  <form action="enviar_recomendacion.php" method="post">

    <label>Tu nombre:</label>
    <input type="text" name="nombre" required>

    <br><br>

    <label>Nombre de tu amigo:</label>
    <input type="text" name="nombre_amigo" required>

    <br><br>

    <label>Correo de tu amigo:</label>
    <input type="email" name="email_amigo" required>

    <br><br>

    <button type="submit">Recomendar sitio</button>

  </form>
</body>

</html>
